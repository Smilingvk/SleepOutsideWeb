<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>

  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main>
      <div class="checkout-container">
        <!-- Checkout Form -->
        <section class="checkout-form" aria-labelledby="checkout-title">
          <h1 id="checkout-title">Checkout</h1>

          <div id="checkout-alert" class="alert"></div>

          <form id="checkout-form" name="checkout">
            <!-- Customer Information -->
            <div class="form-section">
              <h3>Customer Information</h3>
              <div class="form-row">
                <div class="form-group">
                  <label for="fname">First Name *</label>
                  <input
                    type="text"
                    id="fname"
                    name="fname"
                    required
                    placeholder="John"
                  />
                </div>
                <div class="form-group">
                  <label for="lname">Last Name *</label>
                  <input
                    type="text"
                    id="lname"
                    name="lname"
                    required
                    placeholder="Doe"
                  />
                </div>
              </div>
            </div>

            <!-- Shipping Address -->
            <div class="form-section">
              <h3>Shipping Address</h3>
              <div class="form-group">
                <label for="street">Street Address *</label>
                <input
                  type="text"
                  id="street"
                  name="street"
                  required
                  placeholder="123 Main Street"
                />
              </div>
              <div class="form-group">
                <label for="city">City *</label>
                <input
                  type="text"
                  id="city"
                  name="city"
                  required
                  placeholder="Rexburg"
                />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="state">State *</label>
                  <input
                    type="text"
                    id="state"
                    name="state"
                    required
                    maxlength="2"
                    placeholder="ID"
                  />
                </div>
                <div class="form-group">
                  <label for="zip">Zip Code *</label>
                  <input
                    type="text"
                    id="zip"
                    name="zip"
                    required
                    pattern="[0-9]{5}"
                    placeholder="83440"
                  />
                </div>
              </div>
            </div>

            <!-- Payment Information -->
            <div class="form-section">
              <h3>Payment Information</h3>
              <div class="form-group">
                <label for="cardNumber">Card Number *</label>
                <input
                  type="text"
                  id="cardNumber"
                  name="cardNumber"
                  required
                  pattern="[0-9]{16}"
                  placeholder="1234123412341234"

                />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="expiration">Expiration (MM/YY) *</label>
                  <input
                    type="text"
                    id="expiration"
                    name="expiration"
                    required
                    placeholder="12/25"

                  />
                </div>
                <div class="form-group">
                  <label for="code">Security Code *</label>
                  <input
                    type="text"
                    id="code"
                    name="code"
                    required
                    pattern="[0-9]{3}"
                    maxlength="3"
                    placeholder="123"

                  />
                </div>
              </div>
            </div>

            <button type="submit" class="checkout-button">
              Complete Purchase
            </button>
          </form>
        </section>

        <aside class="order-summary" aria-labelledby="summary-title">
          <h2 id="summary-title">Order summary</h2>

          <div class="summary-line">
            <span>Subtotal <span id="item-count"></span></span>
            <span id="subtotal">$0.00</span>
          </div>

          <div class="summary-line">
            <span>Shipping</span>
            <span id="shipping">$0.00</span>
          </div>

          <div class="summary-line">
            <span>Tax (6%)</span>
            <span id="tax">$0.00</span>
          </div>

          <div class="summary-line total">
            <span>Order Total</span>
            <span id="order-total">$0.00</span>
          </div>

          <p class="form-note">* All fields are required</p>
        </aside>
      </div>
    </main>

    <footer id="main-footer"></footer>

  </body>
</html>
