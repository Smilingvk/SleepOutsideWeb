<a class="logo" href="index.html" aria-label="Sleep Outside home">
  <span class="logo-mark" aria-hidden="true">
    <img src="images/brand-icon.webp" alt="" />
  </span>
  <span class="logo-type"><span class="logo-name">Sleep<span>Outside</span></span><span class="logo-tagline">GEAR FOR THE WILD</span></span>
</a>

<div class="search-container">
  <form id="search-form" class="search-form" role="search">
    <input
      type="search"
      id="search-input"
      name="search"
      role="combobox"
      aria-autocomplete="list"
      placeholder="Search camping gear..."
      aria-label="Search products"
      aria-controls="search-suggestions"
      aria-expanded="false"
      autocomplete="off"
      required
    />
    <button type="submit" class="search-button" aria-label="Search">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1 0 14 15.5l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 9.5 5a4.5 4.5 0 0 1 0 9z" fill="currentColor" />
      </svg>
    </button>
  </form>
  <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Product suggestions" hidden></div>
</div>

<div class="cart">
  <a href="cart/index.html" id="cart-link" aria-label="Shopping cart">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM6.2 6l.8 2h12.6l-1.8 7H8.1L4.2 3H1V1h4.7l.8 3H22l-2.8 13.1a2 2 0 0 1-2 1.6H8.1a2 2 0 0 1-1.9-1.3L2.8 6H6.2Z" />
    </svg>
  </a>
</div>
