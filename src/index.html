<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" type="module"></script>

  </head>

  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="hero" aria-labelledby="hero-title">
        <img
          src="images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg 1200w"
          sizes="(max-width: 600px) 100vw, 1200px"
          alt="A quiet alpine lake surrounded by mountains"
        />
        <div class="hero-copy">
          <p class="eyebrow">Find your next campsite</p>
          <h1 id="hero-title">Make room for the outdoors.</h1>
          <p>Thoughtful camping gear for slow mornings, long trails, and nights under the stars.</p>
          <a class="button button--light" href="product_listing/index.html?category=tents">Shop the collection</a>
        </div>
      </section>
      <section class="categories-section" aria-labelledby="categories-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Pack for the journey</p>
            <h2 id="categories-title">Shop by category</h2>
          </div>
        </div>
        <div class="categories">
        <a href="product_listing/index.html?category=tents" class="category-card">
          <span class="category-art"><img src="images/categories/tents.webp" alt="" loading="lazy" /></span>
          <h3>Tents</h3>
        </a>

        <a href="product_listing/index.html?category=backpacks" class="category-card">
          <span class="category-art"><img src="images/categories/backpacks.webp" alt="" loading="lazy" /></span>
          <h3>Backpacks</h3>
        </a>

        <a href="product_listing/index.html?category=sleeping-bags" class="category-card">
          <span class="category-art"><img src="images/categories/sleeping-bags.webp" alt="" loading="lazy" /></span>
          <h3>Sleeping Bags</h3>
        </a>

        <a href="product_listing/index.html?category=hammocks" class="category-card">
          <span class="category-art"><img src="images/categories/hammocks.webp" alt="" loading="lazy" /></span>
          <h3>Hammocks</h3>
        </a>
        </div>
      </section>

      <section class="products" aria-labelledby="featured-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Field favorites</p>
            <h2 id="featured-title">Featured tents</h2>
          </div>
          <a class="text-link" href="product_listing/index.html?category=tents">View all tents →</a>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
